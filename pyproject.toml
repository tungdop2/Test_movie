[project]
name = "movie-assistant"
version = "0.1.0"
description = "Personalised movie assistant over MovieLens ratings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "langchain-openai>=1.6.2",
    "langchain-core>=1.6.3",
    "openai>=3.16.2",
]

[project.scripts]
movie-assistant = "sources.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sources"]

[tool.uv]
package = true
